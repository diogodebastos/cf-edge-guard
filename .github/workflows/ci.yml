name: ci

# Validation only. This workflow never runs `terraform apply`: Edge Guard is
# applied from a workstation against local state, so CI has no credentials and
# cannot change the live zone.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  terraform:
    name: terraform fmt / init / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.3
      - name: terraform fmt -check
        run: terraform fmt -check -recursive
      - name: terraform init (no backend, no credentials)
        run: terraform init -backend=false
      - name: terraform validate
        run: terraform validate

  worker:
    name: worker typecheck / bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck
      - name: inline client script must parse
        run: npm run check:js
      - name: bundle (dry run, never deploys)
        run: npx wrangler deploy --dry-run --outdir dist
